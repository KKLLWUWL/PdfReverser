<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 倒序引擎</title>
<script src="pdf-lib.min.js"></script>
</head>
<body style="display:none">
<script>
/* ============================================================
 * PdfReverser 处理引擎（隐藏 WebView 承载）
 * 通过 pdf-lib 做结构级页面倒序：仅调整页面树顺序，
 * 不重新渲染、不重新压缩任何内容流。
 * 对外暴露 window.__reverseBase64(b64)，
 * 完成后回调 AndroidBridge.onResult(err, outB64, pageCount)。
 * ============================================================ */
(function () {
  'use strict';

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }

  function bytesToB64(bytes) {
    var CHUNK = 0x8000, bin = '';
    for (var i = 0; i < bytes.length; i += CHUNK) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
    }
    return btoa(bin);
  }

  window.__pdfEngineReady = true;   // 引擎就绪标志（Java 端据此等待）

  window.__reverseBase64 = function (b64) {
    var cb = function (err, outB64, n) {
      if (window.AndroidBridge && AndroidBridge.onResult) {
        AndroidBridge.onResult(err || '', outB64 || '', n || 0);
      }
    };
    try {
      var bytes = b64ToBytes(b64);
      PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true, updateMetadata: false })
        .then(function (doc) {
          var n = doc.getPageCount();
          var outB64 = null;
          if (n > 1) {
            var orig = [];
            for (var i = 0; i < n; i++) orig.push(doc.getPage(i));
            while (doc.getPageCount() > 0) doc.removePage(0);
            for (var i = orig.length - 1; i >= 0; i--) {
              doc.insertPage(doc.getPageCount(), orig[i]);
            }
            return doc.save({ useObjectStreams: false }).then(function (out) {
              outB64 = bytesToB64(out);
              cb(null, outB64, n);
            });
          }
          // 单页无需重排，原样返回
          cb(null, null, n);
        })
        .catch(function (e) { cb(String(e && e.message || e), null, 0); });
    } catch (e) {
      cb(String(e && e.message || e), null, 0);
    }
  };
})();
</script>
</body>
</html>
